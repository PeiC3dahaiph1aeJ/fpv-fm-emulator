name: "Sweep across bands (detector coverage check)"
type: sweep

signal:
  standard: NTSC60
  # Was multiburst at 10 MSPS, chosen for "maximum HF content". That predates the
  # bench finding that the detector matches the modulation PROFILE: the colour
  # subcarrier is what makes it read as FPV video, and 10 MSPS is below the floor
  # for it, so the sweep radiated something no detector was going to recognise.
  pattern: color_bars
  sample_rate: 20.0e6
  deviation_pp_hz: 7.0e6
  gain_db: -8

sweep:
  # One representative per band; replace with the channels you need.
  # NOTE: C1..C8 exist in FOUR bands (G13 1.3G / G09 900M / G24 2.4G / G33 3.3G),
  # so a bare "C4" is ambiguous and is rejected — always write BAND:CHANNEL.
  channels: [G13:C4, R4, F4]
  #          ^1200 MHz (G13, 1.2/1.3 GHz)
  #                   ^5769 MHz (R4, Raceband)
  #                       ^5800 MHz (F4, Band F)
  # freq_list_mhz: [915, 1200, 2450, 3400, 5769]   # alternative: set manually
  dwell_s: 3.0
  loops: 0
