name: "Свіп по діапазонах (перевірка покриття детектора)"
type: sweep

signal:
  standard: NTSC60
  pattern: multiburst   # максимум ВЧ -> найширша зайнята смуга
  sample_rate: 10.0e6
  deviation_pp_hz: 7.0e6
  gain_db: -8

sweep:
  # по одному представнику з кожного діапазону; замініть на потрібні канали
  channels: [C4, R4, F4]          # 1200 МГц, 5769 МГц, 5800 МГц ...
  # freq_list_mhz: [915, 1200, 2450, 3400, 5769]   # альтернатива: вручну
  dwell_s: 3.0
  loops: 0
