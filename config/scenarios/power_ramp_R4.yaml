name: "Power ramp R4 (drone approaching / moving away)"
type: power_ramp

signal:
  standard: PAL50
  # The profile the detector actually recognises: colour bars with a 4.43 MHz
  # subcarrier and wide FM. It matches on the modulation, not on RSSI — a narrow
  # black-and-white signal reads as strong and is not recognised.
  pattern: color_bars
  sample_rate: 20.0e6    # 20 MSPS is the floor for this profile
  deviation_pp_hz: 7.0e6
  # gain is set by the power_ramp block below

power_ramp:
  channel: R4           # 5769 MHz
  start_db: -50         # "far away" (weak signal)
  end_db: 0             # "close by" (maximum)
  duration_s: 15        # duration of a single pass
  steps: 60             # number of ramp steps
  mode: pingpong        # up | down | pingpong (approaching + moving away)
  loops: 0              # 0 = infinite
