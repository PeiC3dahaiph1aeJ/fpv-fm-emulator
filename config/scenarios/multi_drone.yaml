name: "Several drones at once (5.8 GHz)"
type: multi_drone

signal:
  standard: PAL50
  sample_rate: 20.0e6   # wider instantaneous bandwidth to fit the spaced carriers
  deviation_pp_hz: 6.0e6
  gain_db: -6

multi_drone:
  center_channel: R4    # Pluto carrier = 5769 MHz (center)
  # offset_mhz — offset of each drone from the center; must fit within fs/2
  drones:
    - { pattern: bars,     offset_mhz: -6.0, level_db: 0 }    # ~5763 MHz
    - { pattern: grid,     offset_mhz:  0.0, level_db: -3 }   # ~5769 MHz
    - { pattern: checker,  offset_mhz:  6.0, level_db: -6 }   # ~5775 MHz
  hold_s: 0             # 0 = hold until stopped
