name: "Sweep across ranges (example)"
type: sweep

# Realistic FPV profile: color bars with a 4.43 MHz subcarrier + wide FM
# -> occupied bandwidth ~17 MHz, just like a real VTX. The detector does not
# merely see RSSI, it also RECOGNIZES the signal as FPV video.
signal:
  standard: PAL50
  pattern: color_bars      # color = 4.43 MHz subcarrier -> "FPV-like" spectrum
  sample_rate: 20.0e6
  deviation_pp_hz: 6.0e6   # ~17 MHz of occupied bandwidth
  gain_db: 0

sweep:
  # EXAMPLE ranges (standard FPV bands). Replace with the ones you need.
  ranges:
    - { start_mhz: 1200, stop_mhz: 1360, step_mhz: 20 }   # 1.2/1.3 GHz FPV
    - { start_mhz: 5650, stop_mhz: 5950, step_mhz: 20 }   # 5.8 GHz FPV
  dwell_s: 15              # transmit time on each frequency
  pause_s: 5              # pause (RF off) between frequencies
  loops: 0                # 0 = infinite (Ctrl+C or Stop in the GUI)
