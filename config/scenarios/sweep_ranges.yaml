name: "Свіп по діапазонах (приклад)"
type: sweep

# Реалістичний FPV-профіль: кольорові смуги з піднесучою 4.43 МГц + широка ЧМ
# -> зайнята смуга ~17 МГц, як справжній VTX. Детектор не лише бачить RSSI, а й
# РОЗПІЗНАЄ сигнал як FPV-відео.
signal:
  standard: PAL50
  pattern: color_bars      # колір = піднесуча 4.43 МГц -> «FPV-подібний» спектр
  sample_rate: 20.0e6
  deviation_pp_hz: 6.0e6   # ~17 МГц зайнятої смуги
  gain_db: 0

sweep:
  # ПРИКЛАД діапазонів (стандартні FPV-смуги). Замініть на потрібні вам.
  ranges:
    - { start_mhz: 1200, stop_mhz: 1360, step_mhz: 20 }   # 1.2/1.3 ГГц FPV
    - { start_mhz: 5650, stop_mhz: 5950, step_mhz: 20 }   # 5.8 ГГц FPV
  dwell_s: 15              # передача на кожній частоті
  pause_s: 5              # пауза (RF off) між частотами
  loops: 0                # 0 = нескінченно (Ctrl+C або Стоп у GUI)
