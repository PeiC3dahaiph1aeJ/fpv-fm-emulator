name: "Raceband sweep (5.8 GHz)"
type: sweep

signal:
  standard: PAL50
  pattern: bars
  sample_rate: 8.0e6
  deviation_pp_hz: 6.0e6
  gain_db: -10

sweep:
  band: R               # all of R1..R8; or channels: [R1, R4, R8]
  # group: "5.8G"       # alternative: iterate over all 5.8 GHz channels
  dwell_s: 2.0          # dwell time on each channel
  loops: 0              # 0 = infinite
